name = "multi-family-usa"
compatibility_date = "2026-07-18"
compatibility_flags = ["nodejs_compat"]
main = "@astrojs/cloudflare/entrypoints/server"

[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true

[assets]
directory = "./dist/client"
binding = "ASSETS"
not_found_handling = "404-page"
# Match Astro trailingSlash:"always" — non-slash HTML requests redirect to slash form.
html_handling = "force-trailing-slash"
# API routes are SSR. Also run the worker first on paths that must strip
# legacy query strings (SearchAction `?q=` + calculator → deal-review params).
# See src/middleware.ts. All other static HTML stays on the CDN path.
run_worker_first = [
  "/",
  "/es",
  "/es/",
  "/deal-review",
  "/deal-review/",
  "/es/deal-review",
  "/es/deal-review/",
  "/api/*",
]
